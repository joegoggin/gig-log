[package]
name = "gig-log-frontend"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gig-log-common = { path = "../common" }
goggin-rs-logger = { git = "https://github.com/joegoggin/goggin-rs-logger", tag = "v0.1.0", features = [
    "leptos",
] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
leptos = { version = "0.8.16", features = ["csr"] }
leptos_router = "0.8.12"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
wasm-bindgen = "0.2.114"
web-sys = { version = "0.3.91", features = [
    "Window",
    "Location",
    "Storage",
    "console",
    "EventTarget",
    "MediaQueryList",
    "MediaQueryListEvent",
] }
